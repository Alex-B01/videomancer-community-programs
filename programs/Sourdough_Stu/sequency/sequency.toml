#
# SEQUENCY - Walsh-Hadamard organ (FULL-CHROMA, R2SDF).  Program 5.
# NOTE: the all-timings key is intentionally OMITTED -- its absence IS the
# all-formats declaration (block tiling self-calibrates from avid edges; no
# framebuffer, no temporal state).  Musical knob scaling lives here
# (control_mode / value_labels), not in fabric.
# Full-chroma build: a wht_organ_lane runs on each of Y/U/V (chroma always on).
# Knob 5 (Crosstalk) and Toggle 11 (Chroma) are RESERVED/INERT (read, not acted
# on) after the Gate-1 timing rework dropped the cross-lane CROSSTALK datapath;
# both stay declared for forward-compat.  Toggles 7/8 likewise carry inert
# retired-mode positions (v1 fabric is always Hard / XOR).

[program]
program_id = "com.sourdoughstu.sequency"
program_name = "Sequency"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "AB (Sourdough_Stu)"
license = "GPL-3.0"
categories = ["Signal", "Pattern", "Glitch"]
program_type = "processing"
description = "Full-chroma Walsh-Hadamard organ: Y/U/V spectral blocks played with quantize, tilt, scramble, regen, and adapt."
hardware_compatibility = ["rev_a", "rev_b"]
core = "yuv444_30b"
url = "https://github.com/lzxindustries/videomancer-community-programs"

# ---------------------------------------------------------------------------
# Knobs
# ---------------------------------------------------------------------------

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Quantize"
control_mode = "quad_in"          # gentle onset
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Tilt"
control_mode = "linear"           # bipolar, 512 = flat (attenuate-only)
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scramble"
control_mode = "linear"           # basis XOR permutation depth
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Regen"
control_mode = "quart_out"        # fine near resonance; fabric clamps loop gain < 1
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

# Knob 5 (Crosstalk): RESERVED / INERT (read, not acted on).  The cross-lane
# CROSSTALK datapath was dropped in the Gate-1 timing rework; the control stays
# declared (12-control map preserved) but the fabric ignores it.
[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Crosstalk"
control_mode = "linear"           # bipolar, 512 = no leakage
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Adapt"
control_mode = "linear"           # Y energy -> quantizer self-mod (intra-frame)
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

# ---------------------------------------------------------------------------
# Toggles.  Tog7/Tog8 are v1 single-state: the retired-mode position is read
# but INERT (fabric always does Hard / XOR).  Labels kept for forward-compat.
# ---------------------------------------------------------------------------

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Quantizer"
value_labels = ["Hard", "Dithered"]
initial_value_label = "Hard"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Scramble Mode"
value_labels = ["XOR", "Rotate"]
initial_value_label = "XOR"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Adapt Polarity"
value_labels = ["Normal", "Inverted"]
initial_value_label = "Normal"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Spectral Hold"
value_labels = ["Live", "Hold"]
initial_value_label = "Live"

# Toggle 11 (Chroma): RESERVED / INERT, fixed-on.  Chroma always flows through
# the x3 lane path now; the "Luma only" bypass is retired.  Read but not acted
# on; kept declared for forward-compat.
[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Chroma"
value_labels = ["Luma only", "Chroma too"]
initial_value_label = "Chroma too"

# ---------------------------------------------------------------------------
# Fader
# ---------------------------------------------------------------------------

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Dry / Wet"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

# ---------------------------------------------------------------------------
# Factory presets
# ---------------------------------------------------------------------------

# Clean = dry passthrough: all effect knobs neutral (Tilt/Crosstalk at 512
# center), fader dry.  Neutral + wet round-trips bit-exact (WHT identity).
[[preset]]
name = "Clean"
rotary_potentiometer_1 = 0
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 0
rotary_potentiometer_4 = 0
rotary_potentiometer_5 = 512
rotary_potentiometer_6 = 0
toggle_switch_7 = 0
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 0
toggle_switch_11 = 1
linear_potentiometer_12 = 0

[[preset]]
name = "Bitrate Starve"
rotary_potentiometer_1 = 720
rotary_potentiometer_2 = 700
rotary_potentiometer_6 = 512
linear_potentiometer_12 = 900

[[preset]]
name = "Regen Bloom"
rotary_potentiometer_2 = 320
rotary_potentiometer_4 = 820
rotary_potentiometer_3 = 180
linear_potentiometer_12 = 1023

[[preset]]
name = "Chroma Bleed"
rotary_potentiometer_1 = 300
rotary_potentiometer_5 = 820
rotary_potentiometer_2 = 640
linear_potentiometer_12 = 1000
