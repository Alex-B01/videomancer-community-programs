# SEQUENCY - Walsh-Hadamard organ (Y-ONLY, R2SDF).  Program 5.
# NOTE: the all-timings key is intentionally OMITTED -- its absence IS the
# all-formats declaration (block tiling self-calibrates from avid edges; no
# framebuffer, no temporal state).  Musical knob scaling lives here
# (control_mode / value_labels), not in fabric.
# Y-only build: one wht_organ_lane runs on Y; U/V are PASSTHROUGH (delay-matched
# to the Y organ+fader latency).  The full-chroma 3-lane build was congestion-
# bound on HD timing; reverted to the proven Y-only scope.
# REV-F (v1.0 completion) makes all four formerly-dead controls LIVE: Knob 5
# (Crosstalk = output-stage Y->C effect-residual leak, opposite-signed into U/V),
# Toggle 11 (Chroma = leak hard-off master, default "Luma only"), Toggle 7
# (Dithered = LFSR dither at the QUANTIZE deadzone edge) and Toggle 8 (Rotate =
# barrel-rotate coeff index).  No parameter shapes change vs the declared REV-E
# map -- only the wiring and these comments.

[program]
program_id = "com.sourdoughstu.sequency"
program_name = "Sequency"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "AB (Sourdough_Stu)"
license = "GPL-3.0"
categories = ["Signal", "Pattern", "Glitch"]
program_type = "processing"
description = "Walsh-Hadamard luma organ: Y spectral blocks played with quantize, tilt, scramble, regen, and adapt (U/V passthrough)."
hardware_compatibility = ["rev_a", "rev_b"]
core = "yuv444_30b"
url = "https://github.com/lzxindustries/videomancer-community-programs"

# ---------------------------------------------------------------------------
# Knobs
# ---------------------------------------------------------------------------

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Quantize"
control_mode = "quad_in"          # gentle onset
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Tilt"
control_mode = "linear"           # bipolar, 512 = flat (attenuate-only)
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scramble"
control_mode = "linear"           # basis XOR permutation depth
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Regen"
control_mode = "quart_out"        # fine near resonance; fabric clamps loop gain < 1
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

# Knob 5 (Crosstalk): LIVE -- bipolar control for the output-stage Y->C effect-
# residual leak.  Center 512 = OFF (center detent); the knob's side selects the
# opposite-signed U/V polarity, and |distance| top-3-bits set the leak strength as
# a barrel-shift amount (no runtime multiply).  Gated by Toggle 11 (master).
[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Crosstalk"
control_mode = "linear"           # bipolar, 512 = OFF (no leak)
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Adapt"
control_mode = "linear"           # Y energy -> quantizer self-mod (intra-frame)
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

# ---------------------------------------------------------------------------
# Toggles.  Tog7 (Hard/Dithered) and Tog8 (XOR/Rotate) are LIVE (REV-F):
# Dithered adds threshold-scaled LFSR dither at the QUANTIZE deadzone edge (DC
# preserved; Hard is bit-exact); Rotate barrel-rotates the coeff index (0->0
# keeps DC) as an alternative to XOR.
# ---------------------------------------------------------------------------

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Quantizer"
value_labels = ["Hard", "Dithered"]
initial_value_label = "Hard"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Scramble Mode"
value_labels = ["XOR", "Rotate"]
initial_value_label = "XOR"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Adapt Polarity"
value_labels = ["Normal", "Inverted"]
initial_value_label = "Normal"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Spectral Hold"
value_labels = ["Live", "Hold"]
initial_value_label = "Live"

# Toggle 11 (Chroma): LIVE -- hard-off master enable for the Crosstalk leak.
# "Luma only" forces the leak OFF regardless of Knob 5 (a performance guarantee a
# center detent can't give); "Chroma too" arms it.  Default "Luma only" -> the
# leak is off at load (chroma clean); the label stays honest (chroma IS affected
# by the bleed when armed).
[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Chroma"
value_labels = ["Luma only", "Chroma too"]
initial_value_label = "Luma only"

# ---------------------------------------------------------------------------
# Fader
# ---------------------------------------------------------------------------

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Dry / Wet"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

# ---------------------------------------------------------------------------
# Factory presets
# ---------------------------------------------------------------------------

# Clean = dry passthrough: all effect knobs neutral (Tilt/Crosstalk at 512
# center), fader dry.  Neutral + wet round-trips bit-exact (WHT identity).
[[preset]]
name = "Clean"
rotary_potentiometer_1 = 0
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 0
rotary_potentiometer_4 = 0
rotary_potentiometer_5 = 512
rotary_potentiometer_6 = 0
toggle_switch_7 = 0
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 0
toggle_switch_11 = 0
linear_potentiometer_12 = 0

[[preset]]
name = "Bitrate Starve"
rotary_potentiometer_1 = 720
rotary_potentiometer_2 = 700
rotary_potentiometer_6 = 512
linear_potentiometer_12 = 900

[[preset]]
name = "Regen Bloom"
rotary_potentiometer_2 = 320
rotary_potentiometer_4 = 820
rotary_potentiometer_3 = 180
linear_potentiometer_12 = 1023

[[preset]]
name = "Chroma Bleed"
rotary_potentiometer_1 = 300
rotary_potentiometer_5 = 820
rotary_potentiometer_2 = 640
toggle_switch_11 = 1          # arm the leak master (default is "Luma only" = off)
linear_potentiometer_12 = 1000
