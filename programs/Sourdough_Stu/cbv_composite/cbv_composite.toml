#
# CBV Composite Program Configuration
#
# Circuit facts: Syntonie CBV001 Rev C schematic (CC BY-SA 4.0) and Phil
# Baljeu's Archer trace; the program models behaviour and copies no artwork.
#
# STATUS: Stage 1 (codec round trip) -- not a usable instrument yet. The full
# control map (spec.md rev 2 §4, single source of truth) is declared now so
# later stages never change it; the Stage-1 fabric reads only Encode (T8),
# Decode (T9) and the timing ID. Presets arrive with Stage 4.
# All-formats declaration: the timing-restriction key is intentionally
# omitted; its absence means every video timing is supported.

[program]
program_id = "com.sourdoughstu.cbv_composite"
program_name = "CBV Composite"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "Sourdough Stu"
license = "GPL-3.0"
categories = ["Signal", "Glitch", "Tube", "Color"]
program_type = "processing"
description = "Syntonie CBV001 composite bender on a virtual composite path: encoder, bent cell, virtual TV. Stage 1: codec round trip."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
# Mirrors the VHDL latency literal (full program_top boundary latency; even, /4).
# Edit both together: if they disagree the packer uses this value.
processing_delay_clks = 8

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Enhance"
control_mode = "linear"
initial_value = 318

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Ring"
control_mode = "linear"
initial_value = 0

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Ring Freq"
control_mode = "linear"
initial_value = 829

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Smear / Boost"
control_mode = "linear"
initial_value = 512

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Tame"
control_mode = "quad_out"
initial_value = 0

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Leak"
control_mode = "linear"
initial_value = 0

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Sync"
value_labels = ["Bent", "Clean"]
initial_value_label = "Clean"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Encode"
value_labels = ["NTSC", "PAL"]
initial_value_label = "NTSC"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Decode"
value_labels = ["NTSC", "PAL-S"]
initial_value_label = "NTSC"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Hue Bend"
value_labels = ["Stepped", "Smooth"]
initial_value_label = "Stepped"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Clamp"
value_labels = ["Porch", "Picture"]
initial_value_label = "Porch"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Colour"
control_mode = "linear"
initial_value = 512
