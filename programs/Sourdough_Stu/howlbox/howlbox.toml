# HOWLBOX Program Configuration
#
# All-formats declaration: the timing-restriction key is intentionally omitted;
# its absence means every video timing is supported (CI asserts it stays absent).
# Musical scaling lives here (control_mode / value_labels) -> zero fabric on knob
# response; the fabric receives the raw 10-bit register value.

[program]
program_id = "com.sourdoughstu.howlbox"
program_name = "HOWLBOX"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "AB (Sourdough_Stu)"
license = "GPL-3.0"
categories = ["Tube", "Glitch", "Signal", "Color"]
program_type = "processing"
description = "Virtual bent enhancer: coupled peaking, resonant ring, rupture, chroma NCO rainbow and content-driven virtual sync."
hardware_compatibility = ["rev_a", "rev_b"]
core = "yuv444_30b"
url = "https://github.com/lzxindustries/videomancer-community-programs"

# ---------------------------------------------------------------------------
# Operating point + behaviours (pots -> registers_in(0..5))
# ---------------------------------------------------------------------------

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "ENHANCE"
control_mode = "quad_in"        # gentle onset into the nonlinearity
min_value = 0
max_value = 1023
initial_value = 0

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "RING"
control_mode = "quart_out"      # fine control near resonance; fabric clamps loop gain < 1
min_value = 0
max_value = 1023
initial_value = 0

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "RAINBOW"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "RUPTURE"
control_mode = "quad_in"        # init = no rupture (clean load)
min_value = 0
max_value = 1023
initial_value = 0

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "SYNC STRESS"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "STARVE"
control_mode = "quad_in"        # correlated systemic death (rate-normalized)
min_value = 0
max_value = 1023
initial_value = 0

# ---------------------------------------------------------------------------
# Toggles (registers_in(6) bits 0..4)
# ---------------------------------------------------------------------------

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Coupling"
value_labels = ["AC", "DC"]
initial_value_label = "DC"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Ring Flavor"
value_labels = ["Overshoot", "Undershoot"]
initial_value_label = "Overshoot"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Rainbow Flavor"
value_labels = ["U leak", "V leak"]
initial_value_label = "U leak"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Body Contact"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Crackle"
value_labels = ["Off", "On"]
initial_value_label = "Off"

# ---------------------------------------------------------------------------
# Master dry/wet (fader -> registers_in(7))
# ---------------------------------------------------------------------------

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Dry / Wet"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0

# ---------------------------------------------------------------------------
# Factory presets
# ---------------------------------------------------------------------------

[[preset]]
name = "Clean"
rotary_potentiometer_1 = 0
rotary_potentiometer_2 = 0
rotary_potentiometer_3 = 0
rotary_potentiometer_4 = 0
rotary_potentiometer_5 = 0
rotary_potentiometer_6 = 0
linear_potentiometer_12 = 0

[[preset]]
name = "Death Flare"
rotary_potentiometer_1 = 600
rotary_potentiometer_2 = 720
rotary_potentiometer_3 = 520
rotary_potentiometer_4 = 400
rotary_potentiometer_5 = 300
rotary_potentiometer_6 = 820
toggle_switch_10 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Rainbow Rot"
rotary_potentiometer_3 = 900
rotary_potentiometer_4 = 500
rotary_potentiometer_5 = 450
toggle_switch_9 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 900
