#
# Pipecheck Program Configuration
#
# SDK 1.0 pipeline re-validation: proc amp -> luma invert -> dry/wet mix -> bypass.
# All-formats declaration: the timing-restriction key is intentionally omitted;
# its absence means every video timing is supported.
# Unused controls (pots 4-6, toggles 8-10) are intentionally undeclared.

[program]
program_id = "com.sourdoughstu.pipecheck"
program_name = "Pipecheck"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "Sourdough Stu"
license = "GPL-3.0"
categories = ["Color"]
program_type = "processing"
description = "Pipeline re-validation: proc amp, luma invert, dry/wet mix, bypass"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
# Mirrors the VHDL latency literal (full program_top boundary latency; even, /4).
# Edit both together: if they disagree the packer uses this value.
processing_delay_clks = 16

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Contrast"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Brightness"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Saturation"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Luma Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Bypass"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Mix"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 1
suffix_label = "%"
